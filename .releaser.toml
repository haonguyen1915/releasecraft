version_targets = []

[project]
type = "poetry"
tag_prefix = "v"
use_native = true

[defaults]
commit = true
tag = true
push = false

[pre_release]
enabled = true
default_channel = "rc"
auto_increment = true
reset_on_bump = true
apply = []
block = []

[changelog]
enabled = true
file = "CHANGELOG.md"
mode = "auto"

[safety]
allow_dirty = false

[ai]
enabled = true
provider = "openai"
model = "gpt-4o-mini"
api_key_env = "OPENAI_API_KEY"
temperature = 0.2
max_tokens = 800
include_diff = false
max_commits = 200
cache = true
accept_automatically = false
fail_on_error = false

[version]
strategy = "auto"
since = ""
to = "HEAD"

[bump_rules]
apply = []
block = []

[hooks]
pre_bump = []
post_bump = []

[pre_release.channel_map]

[provider.poetry]
prefer_command = true
